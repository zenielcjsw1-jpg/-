<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
const password = "0070";   // 원하는 비밀번호
const input = prompt("비밀번호를 입력하세요.");
    if (input !== password) {
    document.write("<h2 style='text-align:center;margin-top:100px;'>접근이 거부되었습니다.</h2>");
    throw new Error("Wrong Password");}
</script>

  <title>인원현황판 Lite v2.4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>

<div class="title">
<span class="title-icon">🏭</span>
<div class="title-text">
<div class="title-row">
<span class="main-title">인원현황판</span>
<span class="version-badge">Lite v3.0</span>
</div>
</div>
</div>

<div class="header-tagline">
<span class="tagline-line"></span>
<svg class="header-emblem" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
<polygon points="32,3 59,17 59,47 32,61 5,47 5,17" fill="none" stroke="url(#emblemGold)" stroke-width="1.6"/>
<polygon points="32,12 51,22 51,42 32,52 13,42 13,22" fill="none" stroke="url(#emblemGold)" stroke-width="1"/>
<rect x="23" y="27" width="8" height="14" fill="none" stroke="url(#emblemGold)" stroke-width="1.4"/>
<rect x="33" y="22" width="8" height="19" fill="none" stroke="url(#emblemGold)" stroke-width="1.4"/>
<circle cx="32" cy="32" r="1.6" fill="#E8C48A"/>
<defs>
<linearGradient id="emblemGold" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#D9A566"/>
<stop offset="1" stop-color="#F5EFE6"/>
</linearGradient>
</defs>
</svg>
<span class="tagline-line"></span>
</div>

<div id="toolbar">
<button id="layoutModeBtn">🛠 레이아웃 편집</button>
<button id="saveBtn">저장</button>
<button id="loadBtn">불러오기</button>
<button id="resetBtn">초기화</button>
</div>
</header>

<!-- 관리자 모드 도구 (레이아웃 편집 시에만 표시) -->
<div id="adminBar" class="admin-bar">
<span class="admin-bar-label">이름표 크기</span>
<input type="range" id="personSizeSlider" min="70" max="140" step="5" value="100">
<span id="personSizeValue">100%</span>
<button id="layoutResetBtn">레이아웃 초기화</button>
</div>

<div class="main-layout">

<!-- 좌측: 오늘업무 -->
<div class="left-todo">
    <div class="todo-panel">
        <h2>📋 오늘 할 일</h2>
        <div class="todo-input-row">
            <input type="text" id="todoInput" placeholder="업무를 입력하세요">
            <div class="todo-btn-row">
                <button id="todoAddBtn">추가</button>
                <button id="todoResetBtn">초기화</button>
            </div>
        </div>

        <div class="todo-list" id="todoList">
            <p class="todo-empty" id="todoEmpty">
                오늘 업무를 추가하세요.
            </p>
        </div>
    </div>
</div>

<!-- 좌측 ↔ 중앙 경계 -->
<div class="resize-handle resize-h" data-target-prev="left-todo" data-target-next="center-board"></div>

<!-- 중앙: 창고 도면 -->
<div class="center-board">

<div class="board-wrap">

<main id="board">
<img
id="warehouse"
src="image/warehouse.png"
alt="창고 도면">

<div id="peopleLayer">

</div>

</main>

<!-- 창고이미지 ↔ 개발예정 경계 -->
<div class="resize-handle resize-v" id="devNoteResizeHandle"></div>

<div class="dev-note">🚧 개발예정 v4.0</div>

</div>  <!-- board-wrap -->

</div>  <!-- center-board -->

<!-- 중앙 ↔ 대기인원 경계 -->
<div class="resize-handle resize-h" data-target-prev="center-board" data-target-next="staging-panel"></div>

<!-- 대기 인원 (세로) -->
<div class="staging-panel">

<h2>🧍 대기 인원</h2>

<div class="staging-area" id="stagingArea">

<div class="person staging" data-id="1" data-name="성락훈">성락훈</div>
<div class="person staging" data-id="2" data-name="김종용">김종용</div>
<div class="person staging" data-id="3" data-name="고목영">고목영</div>
<div class="person staging" data-id="4" data-name="임세호">임세호</div>
<div class="person staging" data-id="5" data-name="이상훈">이상훈</div>

<div class="person staging" data-id="6" data-name="양승규">양승규</div>
<div class="person staging" data-id="7" data-name="김재영">김재영</div>
<div class="person staging" data-id="8" data-name="김병선">김병선</div>
<div class="person staging" data-id="9" data-name="김재욱">김재욱</div>
<div class="person staging" data-id="10" data-name="이흥노">이흥노</div>

<div class="person staging" data-id="11" data-name="장인택">장인택</div>
<div class="person staging" data-id="12" data-name="이건철">이건철</div>
<div class="person staging" data-id="13" data-name="임승현">임승현</div>

<div class="person staging" data-id="14" data-name="심항식">심항식</div>
<div class="person staging" data-id="15" data-name="홍용성">홍용성</div>

<div class="person staging" data-id="16" data-name="남궁정">남궁정</div>
<div class="person staging" data-id="17" data-name="김경훈">김경훈</div>
<div class="person staging" data-id="18" data-name="최성원">최성원</div>
<div class="person staging" data-id="19" data-name="김석원">김석원</div>
<div class="person staging" data-id="20" data-name="양모균">양모균</div>
<div class="person staging" data-id="21" data-name="주용진">주용진</div>
<div class="person staging" data-id="22" data-name="신입">신입</div>

</div>  <!-- staging-area -->

</div>  <!-- staging-panel -->

<!-- 대기인원 ↔ 출근현황 경계 -->
<div class="resize-handle resize-h" data-target-prev="staging-panel" data-target-next="right-panel"></div>

<!-- 우측: 출근 현황 + 특이사항 -->
<div class="right-panel">

<div class="attendance-panel">

<h2>📋 출근 현황</h2>

<div id="todayDate"></div>

<div class="attendance-item total-card" id="totalBox">
<div class="attendance-title">👥 총원</div>
<div class="attendance-number"><span id="totalCount">0</span>명</div>
</div>

<div class="attendance-item work-day-card" id="dayBox">
<div class="attendance-title">☀️ 출근(주간)</div>
<div class="attendance-number"><span id="dayCount">0</span>명</div>
</div>

<div class="attendance-item work-seokgan-card" id="seokganBox">
<div class="attendance-title">🌙 출근(석간)</div>
<div class="attendance-number"><span id="seokganCount">0</span>명</div>
</div>

<div class="attendance-item work-gwangyeok-card" id="gwangyeokBox">
<div class="attendance-title">🚌 출근(광역)</div>
<div class="attendance-number"><span id="gwangyeokCount">0</span>명</div>
</div>

<div class="attendance-item floor1-card" id="floor1Box">
<div class="attendance-title">1️⃣ 1층</div>
<div class="attendance-number"><span id="floor1Count">0</span>명</div>
</div>

<div class="attendance-item office-card" id="officeBox">
<div class="attendance-title">🏢 사무실</div>
<div class="attendance-number"><span id="officeCount">0</span>명</div>
</div>

<div class="attendance-item absent-card" id="absentBox">
<div class="attendance-title">⛔ 결근</div>
<div class="attendance-number"><span id="absentCount">0</span>명</div>
</div>

<div class="attendance-item etc-card" id="etcBox">
<div class="attendance-title">📌 기타</div>
<div class="attendance-number"><span id="etcCount">0</span>명</div>
</div>

</div>

<!-- 특이사항 메모장 -->
<div class="note-panel">
<h2>📝 특이사항</h2>
<textarea id="noteText" placeholder="특이사항을 입력하세요." spellcheck="false" autocorrect="off" autocapitalize="off" autocomplete="off"></textarea>
</div>

</div>  <!-- right-panel -->

</div>  <!-- main-layout -->

<!-- 출근부 팝업 -->
<div id="popup" class="popup">
<div class="popup-box">
<h3 id="popupTitle">목록</h3>
<div id="popupList"></div>
<button id="closePopup">닫기</button>
     </div>
</div>

<!-- 직원 상태 선택 -->
<div id="statusPopup" class="popup">
<div class="popup-box">
<h3 id="statusTitle">직원 상태</h3>

    <button class="status-btn" data-status="주간">
<span>☀️</span> 출근(주간)
</button>

    <button class="status-btn" data-status="석간">
<span>🌙</span> 출근(석간)
</button>

    <button class="status-btn" data-status="광역">
<span>🚌</span> 출근(광역)
</button>

<button class="status-btn" data-status="1층">
<span>1️⃣</span> 1층
</button>

<button class="status-btn" data-status="사무실">
<span>🏢</span> 사무실
</button>

<button class="status-btn" data-status="결근">
<span>⛔</span> 결근
</button>

<button class="status-btn" data-status="휴가">
<span>🏝️</span> 휴가
</button>

<button class="status-btn" data-status="병가">
<span>🩹</span> 병가
</button>

<button class="status-btn" data-status="조퇴">
<span>🚪</span> 조퇴
</button>

<button class="status-btn" data-status="연장">
<span>🌇</span> 연장
</button>

<button id="closeStatusPopup">닫기</button>
</div>
</div>
<script src="script.js"></script>

</body>
</html>
